name: Update EPG

on:
  schedule:
    # Every 12 hours (times are UTC). Runs shortly after epgshare01's
    # daily refresh (~05:40 UTC) and again 12 hours later.
    - cron: "7 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # build_epg.py uses only the Python standard library,
          # so there is nothing else to install.

      - name: Build merged EPG
        run: python build_epg.py

      - name: Commit and push updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_epg_uk.xml.gz custom_epg_us.xml.gz
          if git diff --cached --quiet; then
            echo "No changes to the guide; nothing to commit."
          else
            git commit -m "Update UK and US guides"
            git push origin main
          fi
